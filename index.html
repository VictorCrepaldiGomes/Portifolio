    <!--
      Applies the stored theme before first paint. Without this the page flashes
      light before React mounts, which is the most visible bug a dark site can
      ship. Kept inline and tiny on purpose.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('vc.theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
